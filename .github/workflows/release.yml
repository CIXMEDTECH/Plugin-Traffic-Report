name: Release

# Bump "version" in vespera-plugin.json, then push a tag equal to it:
#   git tag v1.2.3 && git push origin v1.2.3
# The package is attached to the GitHub release. The Vespera plugin market checks
# releases every few hours and opens a pull request for the new version.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test 'test/*.test.mjs'
      - id: pack
        run: echo "json=$(node scripts/pack.mjs --check-tag "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.zip
            dist/*.zip.sha256
          body: |
            `traffic-report` ${{ fromJSON(steps.pack.outputs.json).version }}

            SHA-256: `${{ fromJSON(steps.pack.outputs.json).sha256 }}`

            Install it from **Plugins → Market** in the Vespera admin panel, or upload the zip under **Plugins**.
